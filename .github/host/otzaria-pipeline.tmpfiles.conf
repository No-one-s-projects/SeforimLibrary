# Install on every shared heavy host as /etc/tmpfiles.d/otzaria-pipeline.conf.
d /run/lock/otzaria 1777 root root -
f /run/lock/otzaria/host-heavy.lock 0666 root root -
# Linker writes linker-ner.scope.json dynamically as 0644.  The sticky
# directory preserves its ownership; this repo only removes it via sudo after
# verifying the complete /proc identity while holding host-heavy.lock.
